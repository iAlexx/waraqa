name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: waraqa
          POSTGRES_PASSWORD: waraqa_ci_only
          POSTGRES_DB: waraqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waraqa -d waraqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://waraqa:waraqa_ci_only@localhost:5432/waraqa
      DATABASE_URL_DIRECT: postgresql://waraqa:waraqa_ci_only@localhost:5432/waraqa
      PAYLOAD_SECRET: ci-only-payload-secret-not-for-production-use-32
      PREVIEW_SECRET: ci-only-preview-secret-not-for-production-use-32
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # Phase 13 critical E2E gate (demo content + hard-fail missing seeded procedures)
      WARAQA_PUBLIC_CONTENT_MODE: demo
      WARAQA_PHASE13_CI: "1"
      # CI-only disposable passwords — not production secrets
      WARAQA_PHASE13_CI_PASSWORD: CiOnly-Phase13-Reviewer-Pass!
      WARAQA_PHASE12_SEED_REVIEWER_PASSWORD: CiOnly-Phase13-Reviewer-Pass!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack pnpm 11.14.0
        run: |
          corepack enable
          corepack prepare pnpm@11.14.0 --activate
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm scan:secrets

      - name: Dependency audit (high+)
        run: pnpm audit:deps

      - name: Apply migrations
        run: pnpm db:migrate
        env:
          PAYLOAD_DATABASE_PUSH: "0"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare Phase 13 CI seed (DEMO + disposable admin)
        run: pnpm seed:phase13:ci

      - name: Critical E2E gate
        run: pnpm test:e2e:ci
        env:
          # Prefer production `next start` for stability; Playwright still starts webServer via config.
          # Demo mode + Phase13 CI already set at job env.
          CI: "true"
