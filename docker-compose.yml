# Development-only PostgreSQL for Waraqa Phase 1.
# Do not use this compose file for production or preview.
# Integration tests create/use a sibling database named `<db>_int` (e.g. waraqa_int)
# and must not write to the primary `waraqa` database.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: waraqa
      POSTGRES_PASSWORD: waraqa_dev_only
      POSTGRES_DB: waraqa
    volumes:
      - waraqa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waraqa -d waraqa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waraqa_pgdata:
